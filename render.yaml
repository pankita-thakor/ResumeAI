# Render blueprint for the ResumeAI API (the client stays on Vercel).
#
# Setup: Render dashboard → New → Blueprint → pick this repo. Render reads this file, then
# prompts for every `sync: false` value below.
services:
  - type: web
    name: resumeai-api
    runtime: node
    plan: free
    # Root install so npm workspaces resolve, then compile server/src → server/dist.
    buildCommand: npm install && npm run build -w server
    startCommand: npm run start -w server
    # Render assigns PORT; the server already reads it and binds 0.0.0.0.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Production origin, plus a wildcard for Vercel preview deployments (their hostname
      # changes on every push, so they cannot be listed individually). `*` matches one
      # hostname label only — it never spans a dot.
      - key: CLIENT_ORIGIN
        value: https://resume-ai-seven-swart.vercel.app,https://*-pankitathakor-4970s-projects.vercel.app
      # Prompted on first deploy:
      - key: MONGODB_URI          # Atlas SRV string; allow 0.0.0.0/0 in Atlas Network Access
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: PINECONE_VECTOR_DIMENSION
        sync: false
